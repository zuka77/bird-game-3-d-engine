<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1118">
<title>Bird 3D Engine</title>

<style>
:root{
  --bg:#0d1118;
  --panel:#171d27;
  --panel2:#202735;
  --line:#303949;
  --text:#f5f7fb;
  --muted:#8e99aa;
  --green:#35d477;
  --red:#c63c48;
  --blue:#2faeea;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
button,input,select{font:inherit}
button{
  border:0;border-radius:11px;background:var(--panel2);color:var(--text);
  padding:10px 12px;font-weight:700;white-space:nowrap;cursor:pointer
}
button:active{transform:scale(.97)}
button.active{background:var(--green);color:#07130c}
button.danger{background:var(--red)}
button:disabled{opacity:.4}
input,select{
  width:100%;border:1px solid var(--line);border-radius:9px;
  background:#0e131b;color:var(--text);padding:9px;outline:none
}
input:focus,select:focus{border-color:var(--blue)}
#app{height:100%;display:flex;flex-direction:column}
#top{
  min-height:64px;display:flex;align-items:center;gap:10px;padding:8px 10px;
  background:#121720;border-bottom:1px solid var(--line);z-index:50
}
.logo{font-weight:900;font-size:17px;white-space:nowrap}
#toolbar{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
#toolbar::-webkit-scrollbar{display:none}
#layout{
  flex:1;min-height:0;display:grid;
  grid-template-columns:190px minmax(0,1fr) 220px
}
.panel{background:var(--panel);overflow:auto;padding:12px}
.left{border-right:1px solid var(--line)}
.right{border-left:1px solid var(--line)}
.sectionTitle{
  color:var(--muted);font-size:11px;font-weight:900;
  letter-spacing:1.5px;margin:5px 0 10px
}
.sceneList{display:flex;flex-direction:column;gap:6px}
.sceneItem{
  padding:10px;border-radius:9px;background:var(--panel2);
  font-size:12px;cursor:pointer;display:flex;justify-content:space-between;gap:5px
}
.sceneItem.selected{background:var(--green);color:#06130b}
.toolGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.toolGrid button{font-size:11px}
#viewport{
  position:relative;min-width:0;min-height:0;overflow:hidden;background:#080b10
}
canvas{display:block;width:100%;height:100%;touch-action:none}
.badge{
  position:absolute;z-index:5;top:12px;padding:9px 11px;
  border-radius:10px;background:#111720e8;border:1px solid #2e3948;
  font-size:12px;pointer-events:none
}
#viewBadge{left:12px}
#modeBadge{right:12px}
#statusBadge{
  left:50%;bottom:12px;transform:translateX(-50%);
  white-space:nowrap
}
#toast{
  position:absolute;z-index:100;left:50%;bottom:70px;transform:translateX(-50%);
  background:#202a38;padding:10px 14px;border-radius:10px;
  border:1px solid #394659;font-size:12px;display:none;white-space:nowrap
}
#playOverlay{
  position:absolute;left:0;top:0;width:100%;height:100%;z-index:20;display:none !important;background:transparent;
  pointer-events:none;
}
#playOverlay canvas{width:100%;height:100%;pointer-events:none}
/* Prevent the accidental narrow vertical overlay/strip seen on mobile Safari. */
#playOverlay[style*="display: block"]{width:100%;height:100%;}
#playOverlay[style*="display: block"] #playBar{pointer-events:auto}
#playOverlay[style*="display: block"] #playInfo{pointer-events:none}
#playBar{
  position:absolute;z-index:25;top:12px;left:50%;transform:translateX(-50%);
  display:flex;gap:7px
}
#playInfo{
  position:absolute;left:50%;bottom:20px;transform:translateX(-50%);
  background:#101721d9;border:1px solid #354253;padding:10px 14px;
  border-radius:10px;white-space:nowrap;font-size:12px
}
.fieldLabel{font-size:10px;color:var(--muted);margin:9px 0 5px}
.vecGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.vecGrid label{font-size:9px;color:var(--muted)}
.inspectorTitle{font-size:18px;font-weight:900;margin-bottom:10px}
.info{
  padding:8px 9px;border-radius:9px;background:#10151d;
  border:1px solid var(--line);font-size:10px;color:var(--muted);line-height:1.55
}
.actionRow{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}
#emptyInspector{color:var(--muted);font-size:12px}
.checkboxRow{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);margin-top:9px}
.checkboxRow input{width:auto}
#mobileTools{
  display:none;position:absolute;z-index:10;left:10px;bottom:62px;
  gap:6px;flex-wrap:wrap;max-width:190px
}
@media(max-width:900px){
  #top{min-height:58px}
  .logo{font-size:14px}
  #layout{grid-template-columns:115px minmax(0,1fr) 145px}
  .panel{padding:8px}
  button{font-size:11px;padding:9px 10px}
  .sceneItem{font-size:10px}
  .inspectorTitle{font-size:15px}
}
@media(max-width:650px){
  #layout{grid-template-columns:76px minmax(0,1fr) 110px}
  .panel{padding:6px}
  .sectionTitle{font-size:8px}
  .sceneItem{font-size:9px;padding:8px 5px;overflow:hidden}
  .sceneItem span{overflow:hidden;text-overflow:ellipsis}
  .toolGrid{grid-template-columns:1fr}
  .toolGrid button{font-size:9px;padding:8px 4px}
  .fieldLabel{font-size:8px}
  .vecGrid{grid-template-columns:1fr}
  .vecGrid label{display:none}
  .info{font-size:8px}
  #statusBadge{font-size:10px}
}
@media(orientation:portrait) and (max-width:650px){
  #top{overflow:hidden}
  #toolbar{min-width:0}
}
</style>
</head>

<body>
<div id="app">

<header id="top">
  <div class="logo">🐦 BIRD ENGINE</div>
  <div id="toolbar">
    <button id="cameraBtn" class="active">🎥 Camera</button>
    <button id="moveBtn">✋ Move</button>
    <button id="rotateBtn">🔄 Rotate</button>
    <button id="scaleBtn">📏 Scale</button>
    <button id="addCubeBtn">＋ Cube</button>
    <button id="addSphereBtn">＋ Sphere</button>
    <button id="addCylinderBtn">＋ Cylinder</button>
    <button id="addConeBtn">＋ Cone</button>
    <button id="addPlaneBtn">＋ Plane</button>
    <button id="addCapsuleBtn">＋ Capsule</button>
    <button id="addTorusBtn">＋ Torus</button>
    <button id="addLightBtn">💡 Light</button>
    <button id="duplicateBtn">📋 Duplicate</button>
    <button id="deleteBtn" class="danger">🗑 Delete</button>
    <button id="undoBtn">↶ Undo</button>
    <button id="redoBtn">↷ Redo</button>
    <button id="playBtn">▶ Play</button>
    <button id="saveBtn">💾 Save</button>
    <button id="loadBtn">📂 Load</button>
    <button id="fullscreenBtn">⛶ Fullscreen</button>
  </div>
</header>

<div id="layout">

  <aside class="panel left">
    <div class="sectionTitle">SCENE</div>
    <div id="sceneList" class="sceneList"></div>

    <div class="sectionTitle" style="margin-top:18px">TOOLS</div>
    <div class="toolGrid">
      <button id="focusBtn">🎯 Focus</button>
      <button id="gridBtn" class="active">▦ Grid</button>
      <button id="snapBtn">🧲 Snap OFF</button>
      <button id="resetCameraBtn">📷 Reset</button>
    </div>

    <div class="sectionTitle">PROJECT</div>
    <div class="info">
      <b>Touch</b><br>
      1 finger = camera / selected tool<br>
      2 fingers = pan + pinch zoom<br>
      Rotate = move finger freely<br><br>
      <b>Keyboard</b><br>
      Delete = remove<br>
      Ctrl/Cmd + Z = undo
    </div>
  </aside>

  <main id="viewport">
    <div id="viewBadge" class="badge">3D VIEW</div>
    <div id="modeBadge" class="badge">🎥 CAMERA</div>
    <div id="statusBadge" class="badge">0 objects</div>
    <div id="toast"></div>

    <div id="playOverlay">
      <div id="playBar">
        <button id="stopPlayBtn" class="danger">⏹ Stop</button>
        <button id="playFullscreenBtn">⛶ Fullscreen</button>
      </div>
      <div id="playInfo">▶ PLAY MODE</div>
    </div>
  </main>

  <aside class="panel right">
    <div class="sectionTitle">OBJECT</div>
    <div id="inspector">
      <div id="emptyInspector">Select an object.</div>
    </div>
  </aside>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
"use strict";

/* ============================================================
   BIRD 3D ENGINE
   One-file mobile 3D editor.
   No build step. Designed for GitHub Pages.
   ============================================================ */

const $ = id => document.getElementById(id);

const viewport = $("viewport");
const sceneList = $("sceneList");
const inspector = $("inspector");
const toast = $("toast");
const statusBadge = $("statusBadge");
const modeBadge = $("modeBadge");

let scene;
let camera;
let renderer;
let raycaster;

let objects = [];
let selected = null;
let mode = "camera";

let grid = null;
let ambientLight = null;
let mainLight = null;

let cameraYaw = 0.65;
let cameraPitch = 0.48;
let cameraDistance = 9;
let targetYaw = 0.65;
let targetPitch = 0.48;
let targetDistance = 9;

let cameraTarget = new THREE.Vector3(0,0.7,0);
let targetCameraTarget = new THREE.Vector3(0,0.7,0);

let pointers = new Map();
let lastPointer = {x:0,y:0};
let pinchStartDistance = 0;
let pinchStartCameraDistance = 9;

let dragStart = null;
let snapEnabled = false;
let gridVisible = true;
let playing = false;

let history = [];
let historyIndex = -1;
let historyTimer = null;
let restoring = false;

const STORAGE_KEY = "bird_engine_project_v3";

/* ------------------------- START ------------------------- */

function start(){
  if(typeof THREE === "undefined"){
    showFatal("Three.js ვერ ჩაიტვირთა. ინტერნეტი ჩართულია?");
    return;
  }

  initThree();
  createDefaultScene();
  bindUI();
  resize();
  saveHistory(false);
  animate();
}

function showFatal(text){
  viewport.innerHTML =
    '<div style="padding:30px;color:#fff;font-size:16px">'+escapeHtml(text)+'</div>';
}

/* ------------------------- THREE ------------------------- */

function initThree(){
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x090d13);

  camera = new THREE.PerspectiveCamera(
    60,
    1,
    0.01,
    5000
  );

  renderer = new THREE.WebGLRenderer({
    antialias:true,
    alpha:false,
    powerPreference:"high-performance"
  });

  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.setSize(viewport.clientWidth, viewport.clientHeight);
  renderer.domElement.style.width = "100%";
  renderer.domElement.style.height = "100%";

  viewport.insertBefore(renderer.domElement, viewport.firstChild);

  raycaster = new THREE.Raycaster();

  ambientLight = new THREE.HemisphereLight(0xffffff,0x243044,1.8);
  ambientLight.name = "Ambient Light";
  scene.add(ambientLight);

  mainLight = new THREE.DirectionalLight(0xffffff,2.4);
  mainLight.position.set(8,12,7);
  mainLight.name = "Sun Light";
  scene.add(mainLight);

  createGround();
  createGrid();

  renderer.domElement.addEventListener("pointerdown", pointerDown);
  renderer.domElement.addEventListener("pointermove", pointerMove);
  renderer.domElement.addEventListener("pointerup", pointerUp);
  renderer.domElement.addEventListener("pointercancel", pointerUp);
  renderer.domElement.addEventListener("wheel", wheel, {passive:false});

  window.addEventListener("resize", resize);
  window.addEventListener("keydown", keyDown);
}

function createGround(){
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(200,200),
    new THREE.MeshStandardMaterial({
      color:0x243b30,
      roughness:1
    })
  );

  ground.rotation.x = -Math.PI/2;
  ground.position.y = 0;
  ground.name = "Ground";
  ground.userData.system = true;
  ground.userData.locked = true;
  scene.add(ground);
}

function createGrid(){
  grid = new THREE.GridHelper(200,100,0x4d5968,0x29313c);
  grid.position.y = 0.01;
  grid.name = "Grid";
  grid.userData.system = true;
  scene.add(grid);
}

/* ------------------------- DEFAULT ------------------------- */

function createDefaultScene(){
  addPrimitive("Cube",new THREE.Vector3(0,0.8,0),false);
  addPrimitive("Sphere",new THREE.Vector3(2,0.9,0),false);
  selectObject(objects[0]);
  updateStatus();
}

/* ------------------------- MATERIALS ------------------------- */

function makeMaterial(color){
  return new THREE.MeshStandardMaterial({
    color:color,
    roughness:0.68,
    metalness:0.05
  });
}

/* ------------------------- OBJECT CREATION ------------------------- */

function geometryFor(type){
  if(type==="Cube") return new THREE.BoxGeometry(1.5,1.5,1.5);
  if(type==="Sphere") return new THREE.SphereGeometry(0.9,32,20);
  if(type==="Cylinder") return new THREE.CylinderGeometry(0.8,0.8,1.6,32);
  if(type==="Cone") return new THREE.ConeGeometry(0.9,1.8,32);
  if(type==="Plane") return new THREE.PlaneGeometry(2,2);
  if(type==="Capsule") return new THREE.CapsuleGeometry(0.55,1.2,8,20);
  if(type==="Torus") return new THREE.TorusGeometry(0.8,0.28,16,40);
  return new THREE.BoxGeometry(1,1,1);
}

function defaultY(type){
  if(type==="Sphere") return 0.9;
  if(type==="Cylinder") return 0.8;
  if(type==="Cone") return 0.9;
  if(type==="Capsule") return 1;
  if(type==="Torus") return 0.8;
  if(type==="Plane") return 0.02;
  return 0.75;
}

function colorFor(type){
  const colors = {
    Cube:0x2faeea,
    Sphere:0xffb52e,
    Cylinder:0x9b6cff,
    Cone:0xff5f75,
    Plane:0x45d18a,
    Capsule:0x40d6cf,
    Torus:0xf06be9
  };
  return colors[type] || 0xffffff;
}

function uniqueName(type){
  let n=1;
  while(objects.some(o=>o.name===type+" "+n)) n++;
  return type+" "+n;
}

function addPrimitive(type,pos=null,select=true){
  const mesh = new THREE.Mesh(
    geometryFor(type),
    makeMaterial(colorFor(type))
  );

  mesh.name = uniqueName(type);
  mesh.userData.engine = true;
  mesh.userData.type = type;
  mesh.userData.locked = false;
  mesh.userData.hidden = false;

  if(pos){
    mesh.position.copy(pos);
  }else{
    const angle = objects.length * 0.9;
    mesh.position.set(
      Math.cos(angle)*2.2,
      defaultY(type),
      Math.sin(angle)*2.2
    );
  }

  if(type==="Plane") mesh.rotation.x = -Math.PI/2;

  scene.add(mesh);
  objects.push(mesh);

  refreshSceneList();

  if(select) selectObject(mesh);

  saveHistory();
  updateStatus();
  return mesh;
}

function addLight(){
  const light = new THREE.PointLight(0xffffff,5,25);
  light.name = uniqueName("Light");
  light.userData.engine = true;
  light.userData.type = "Light";
  light.userData.locked = false;
  light.position.set(0,4,2);

  const marker = new THREE.Mesh(
    new THREE.SphereGeometry(0.18,12,8),
    new THREE.MeshBasicMaterial({color:0xfff2a8})
  );
  marker.userData.lightMarker = true;
  light.add(marker);

  scene.add(light);
  objects.push(light);
  refreshSceneList();
  selectObject(light);
  saveHistory();
  updateStatus();
}

/* ------------------------- SCENE LIST ------------------------- */

function refreshSceneList(){
  sceneList.innerHTML = "";

  objects.forEach(obj=>{
    const item = document.createElement("div");
    item.className = "sceneItem";
    if(obj===selected) item.classList.add("selected");

    const name = document.createElement("span");
    name.textContent = (obj.visible===false ? "👁‍🗨 " : "") + obj.name;

    const type = document.createElement("span");
    type.textContent = obj.userData.type || "";
    type.style.opacity = ".55";

    item.appendChild(name);
    item.appendChild(type);

    item.addEventListener("click",()=>selectObject(obj));
    sceneList.appendChild(item);

    obj.userData.listItem = item;
  });

  updateStatus();
}

function updateStatus(){
  statusBadge.textContent = objects.length + " object" + (objects.length===1?"":"s");
}

/* ------------------------- SELECTION ------------------------- */

function selectObject(obj){
  if(obj && obj.userData.system) return;

  selected = obj || null;
  refreshSceneList();
  updateInspector();
}

function updateInspector(){
  if(!selected){
    inspector.innerHTML = '<div id="emptyInspector">Select an object.</div>';
    return;
  }

  const o = selected;
  const isLight = o.userData.type === "Light";
  const color = o.material?.color?.getHexString?.() || "ffffff";

  inspector.innerHTML = `
    <div class="inspectorTitle">${escapeHtml(o.name)}</div>

    <div class="fieldLabel">NAME</div>
    <input id="objName" value="${escapeAttr(o.name)}">

    ${!isLight ? `
    <div class="fieldLabel">COLOR</div>
    <input id="objColor" type="color" value="#${color}">
    ` : `
    <div class="fieldLabel">LIGHT INTENSITY</div>
    <input id="lightIntensity" type="number" step="0.1" value="${Number(o.intensity||1).toFixed(2)}">
    `}

    <div class="actionRow">
      <button id="hideObject">${o.visible ? "👁 Hide" : "👁 Show"}</button>
      <button id="lockObject">${o.userData.locked ? "🔒 Unlock" : "🔓 Lock"}</button>
    </div>

    <div class="fieldLabel">POSITION</div>
    <div class="vecGrid">
      <label>X<input id="px" type="number" step="0.01" value="${o.position.x.toFixed(2)}"></label>
      <label>Y<input id="py" type="number" step="0.01" value="${o.position.y.toFixed(2)}"></label>
      <label>Z<input id="pz" type="number" step="0.01" value="${o.position.z.toFixed(2)}"></label>
    </div>

    <div class="fieldLabel">ROTATION °</div>
    <div class="vecGrid">
      <label>X<input id="rx" type="number" step="1" value="${deg(o.rotation.x)}"></label>
      <label>Y<input id="ry" type="number" step="1" value="${deg(o.rotation.y)}"></label>
      <label>Z<input id="rz" type="number" step="1" value="${deg(o.rotation.z)}"></label>
    </div>

    ${!isLight ? `
    <div class="fieldLabel">SCALE</div>
    <div class="vecGrid">
      <label>X<input id="sx" type="number" step="0.01" value="${o.scale.x.toFixed(2)}"></label>
      <label>Y<input id="sy" type="number" step="0.01" value="${o.scale.y.toFixed(2)}"></label>
      <label>Z<input id="sz" type="number" step="0.01" value="${o.scale.z.toFixed(2)}"></label>
    </div>
    ` : ""}

    <div class="fieldLabel">INFO</div>
    <div class="info">
      Type: ${escapeHtml(o.userData.type||"Object")}<br>
      Visible: ${o.visible ? "Yes" : "No"}<br>
      Locked: ${o.userData.locked ? "Yes" : "No"}
    </div>

    <div class="actionRow">
      <button id="focusObject">🎯 Focus</button>
      <button id="duplicateObject">📋 Duplicate</button>
    </div>
    <button id="deleteObject" class="danger" style="width:100%;margin-top:6px">🗑 Delete Object</button>
  `;

  bindInspector();
}

function bindInspector(){
  const o = selected;
  if(!o) return;

  $("objName").onchange = e=>{
    const value = e.target.value.trim();
    if(value) o.name = value;
    refreshSceneList();
    saveHistory();
  };

  if($("objColor")){
    $("objColor").oninput = e=>{
      if(o.material?.color) o.material.color.set(e.target.value);
      scheduleHistory();
    };
  }

  if($("lightIntensity")){
    $("lightIntensity").oninput = e=>{
      o.intensity = clamp(Number(e.target.value)||0,0,50);
      scheduleHistory();
    };
  }

  $("hideObject").onclick = ()=>{
    o.visible = !o.visible;
    updateInspector();
    saveHistory();
  };

  $("lockObject").onclick = ()=>{
    o.userData.locked = !o.userData.locked;
    updateInspector();
    saveHistory();
  };

  bindNumber("px",v=>o.position.x=v);
  bindNumber("py",v=>o.position.y=v);
  bindNumber("pz",v=>o.position.z=v);

  bindNumber("rx",v=>o.rotation.x=THREE.MathUtils.degToRad(v));
  bindNumber("ry",v=>o.rotation.y=THREE.MathUtils.degToRad(v));
  bindNumber("rz",v=>o.rotation.z=THREE.MathUtils.degToRad(v));

  bindNumber("sx",v=>o.scale.x=Math.max(.001,v));
  bindNumber("sy",v=>o.scale.y=Math.max(.001,v));
  bindNumber("sz",v=>o.scale.z=Math.max(.001,v));

  $("focusObject").onclick = ()=>focusSelected();
  $("duplicateObject").onclick = ()=>duplicateSelected();
  $("deleteObject").onclick = ()=>deleteSelected();
}

function bindNumber(id,fn){
  const el=$(id);
  if(!el) return;
  el.onchange=e=>{
    const v=Number(e.target.value);
    if(Number.isFinite(v)) fn(v);
    updateInspector();
    saveHistory();
  };
}

/* ------------------------- MODES ------------------------- */

function setMode(newMode){
  mode = newMode;

  const map = {
    camera:"🎥 CAMERA",
    move:"✋ MOVE",
    rotate:"🔄 ROTATE",
    scale:"📏 SCALE"
  };

  modeBadge.textContent = map[mode] || mode.toUpperCase();

  ["cameraBtn","moveBtn","rotateBtn","scaleBtn"].forEach(id=>{
    $(id).classList.remove("active");
  });

  const buttonMap = {
    camera:"cameraBtn",
    move:"moveBtn",
    rotate:"rotateBtn",
    scale:"scaleBtn"
  };

  $(buttonMap[mode]).classList.add("active");
}

/* ------------------------- POINTERS ------------------------- */

function pointerDown(e){
  renderer.domElement.setPointerCapture?.(e.pointerId);

  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

  lastPointer.x=e.clientX;
  lastPointer.y=e.clientY;

  if(pointers.size===2){
    const p=[...pointers.values()];
    pinchStartDistance=distance2D(p[0],p[1]);
    pinchStartCameraDistance=targetDistance;
    return;
  }

  if(mode==="camera"){
    const hit=pick(e.clientX,e.clientY);
    if(hit) selectObject(hit);
    return;
  }

  const hit=pick(e.clientX,e.clientY);

  if(hit && !hit.userData.locked){
    selectObject(hit);

    dragStart = {
      x:e.clientX,
      y:e.clientY,
      position:oArray(hit.position),
      rotation:oArray(hit.rotation),
      scale:oArray(hit.scale)
    };
  }else{
    dragStart=null;
  }
}

function pointerMove(e){
  if(!pointers.has(e.pointerId)) return;

  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if(pointers.size===2){
    handleTwoFinger();
    return;
  }

  const dx=e.clientX-lastPointer.x;
  const dy=e.clientY-lastPointer.y;

  if(mode==="camera"){
    targetYaw -= dx*0.008;
    targetPitch -= dy*0.008;
    targetPitch = clamp(targetPitch,-1.52,1.52);
  }else if(selected && !selected.userData.locked){
    applyObjectDrag(dx,dy);
  }

  lastPointer.x=e.clientX;
  lastPointer.y=e.clientY;
}

function pointerUp(e){
  pointers.delete(e.pointerId);

  if(pointers.size<2){
    pinchStartDistance=0;
  }

  if(dragStart){
    if(selected) snapObject(selected);
    saveHistory();
    dragStart=null;
  }
}

function handleTwoFinger(){
  const p=[...pointers.values()];
  if(p.length!==2) return;

  const d=distance2D(p[0],p[1]);

  if(pinchStartDistance>0){
    targetDistance =
      pinchStartCameraDistance*(pinchStartDistance/d);
    targetDistance=clamp(targetDistance,.35,500);
  }

  const cx=(p[0].x+p[1].x)/2;
  const cy=(p[0].y+p[1].y)/2;

  const dx=cx-lastPointer.x;
  const dy=cy-lastPointer.y;

  const panSpeed=Math.max(.001,targetDistance*.0012);

  const right = new THREE.Vector3(
    Math.cos(cameraYaw),0,-Math.sin(cameraYaw)
  );

  const up = new THREE.Vector3(0,1,0);

  targetCameraTarget.addScaledVector(right,-dx*panSpeed);
  targetCameraTarget.addScaledVector(up,dy*panSpeed);

  lastPointer.x=cx;
  lastPointer.y=cy;
}

function applyObjectDrag(dx,dy){
  if(!selected) return;

  if(mode==="move"){
    const speed=Math.max(.002,targetDistance*.0025);

    const right=new THREE.Vector3(
      Math.cos(cameraYaw),0,-Math.sin(cameraYaw)
    );

    const up=new THREE.Vector3(0,1,0);

    selected.position.addScaledVector(right,dx*speed);
    selected.position.addScaledVector(up,-dy*speed);
  }

  if(mode==="rotate"){
    const s=.012;

    selected.rotation.x += dy*s;
    selected.rotation.y += dx*s;
    selected.rotation.z += (dx-dy)*s*.35;
  }

  if(mode==="scale"){
    const factor=1-dy*.01;
    const next=Math.max(.03,Math.min(100,selected.scale.x*factor));
    selected.scale.setScalar(next);
  }

  if(snapEnabled) snapObject(selected);

  updateInspector();
}

function wheel(e){
  e.preventDefault();
  targetDistance *= Math.exp(e.deltaY*.001);
  targetDistance=clamp(targetDistance,.35,500);
}

function distance2D(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y);
}

/* ------------------------- PICK ------------------------- */

function pick(clientX,clientY){
  if(!renderer) return null;

  const rect=renderer.domElement.getBoundingClientRect();

  const x=((clientX-rect.left)/rect.width)*2-1;
  const y=-((clientY-rect.top)/rect.height)*2+1;

  raycaster.setFromCamera({x,y},camera);

  const hits=raycaster.intersectObjects(objects,true);

  for(const hit of hits){
    let obj=hit.object;

    while(obj && !obj.userData.engine && obj.parent){
      obj=obj.parent;
    }

    if(obj?.userData?.engine) return obj;
  }

  return null;
}

/* ------------------------- CAMERA ------------------------- */

function updateCamera(){
  cameraYaw += (targetYaw-cameraYaw)*.14;
  cameraPitch += (targetPitch-cameraPitch)*.14;
  cameraDistance += (targetDistance-cameraDistance)*.14;

  cameraTarget.lerp(targetCameraTarget,.14);

  const horizontal=Math.cos(cameraPitch)*cameraDistance;

  camera.position.set(
    cameraTarget.x + Math.sin(cameraYaw)*horizontal,
    cameraTarget.y + Math.sin(cameraPitch)*cameraDistance,
    cameraTarget.z + Math.cos(cameraYaw)*horizontal
  );

  camera.lookAt(cameraTarget);
}

function resetCamera(){
  targetYaw=.65;
  targetPitch=.48;
  targetDistance=9;
  targetCameraTarget.set(0,.7,0);
  toastMsg("Camera reset");
}

function focusSelected(){
  if(!selected) return;

  const box=new THREE.Box3().setFromObject(selected);
  const center=box.getCenter(new THREE.Vector3());
  const size=box.getSize(new THREE.Vector3());

  targetCameraTarget.copy(center);

  const maxSize=Math.max(size.x,size.y,size.z,1);
  targetDistance=Math.max(2.5,maxSize*3);

  toastMsg("Focused");
}

/* ------------------------- SNAP / GRID ------------------------- */

function snapValue(v,step=.5){
  return Math.round(v/step)*step;
}

function snapObject(o){
  if(!snapEnabled || !o) return;

  o.position.x=snapValue(o.position.x);
  o.position.y=snapValue(o.position.y);
  o.position.z=snapValue(o.position.z);
}

function toggleSnap(){
  snapEnabled=!snapEnabled;
  $("snapBtn").textContent=snapEnabled ? "🧲 Snap ON" : "🧲 Snap OFF";
  $("snapBtn").classList.toggle("active",snapEnabled);

  if(snapEnabled && selected){
    snapObject(selected);
    updateInspector();
    saveHistory();
  }
}

function toggleGrid(){
  gridVisible=!gridVisible;
  grid.visible=gridVisible;
  $("gridBtn").classList.toggle("active",gridVisible);
}

/* ------------------------- DUPLICATE / DELETE ------------------------- */

function duplicateSelected(){
  if(!selected || selected.userData.locked) return;

  if(selected.userData.type==="Light"){
    const light=new THREE.PointLight(
      selected.color || 0xffffff,
      selected.intensity || 5,
      selected.distance || 25
    );

    light.name=uniqueName("Light");
    light.userData.engine=true;
    light.userData.type="Light";
    light.userData.locked=false;
    light.position.copy(selected.position).add(new THREE.Vector3(1,0,1));

    scene.add(light);
    objects.push(light);
    selectObject(light);
    saveHistory();
    return;
  }

  const clone=selected.clone();

  clone.name=uniqueName(selected.userData.type);
  clone.position.x+=1;
  clone.position.z+=1;
  clone.userData=Object.assign({},selected.userData);
  clone.userData.locked=false;
  clone.userData.listItem=null;

  scene.add(clone);
  objects.push(clone);

  selectObject(clone);
  saveHistory();
}

function deleteSelected(){
  if(!selected || selected.userData.locked) return;

  const doomed=selected;
  selected=null;

  removeObject(doomed);

  refreshSceneList();
  updateInspector();
  saveHistory();

  toastMsg("Deleted");
}

function removeObject(o){
  scene.remove(o);

  o.traverse(child=>{
    if(child.geometry && !child.userData?.lightMarker){
      child.geometry.dispose();
    }
  });

  if(o.material){
    if(Array.isArray(o.material)){
      o.material.forEach(m=>m.dispose());
    }else{
      o.material.dispose();
    }
  }

  objects=objects.filter(x=>x!==o);
}

/* ------------------------- HISTORY ------------------------- */

function capture(){
  return objects.map(o=>{
    const data={
      type:o.userData.type,
      name:o.name,
      position:o.position.toArray(),
      rotation:o.rotation.toArray(),
      scale:o.scale.toArray(),
      visible:o.visible,
      locked:!!o.userData.locked
    };

    if(o.userData.type==="Light"){
      data.color=o.color?.getHex?.() ?? 0xffffff;
      data.intensity=o.intensity;
      data.distance=o.distance;
    }else{
      data.color=o.material?.color?.getHex?.() ?? 0xffffff;
    }

    return data;
  });
}

function saveHistory(show=true){
  if(restoring) return;

  const state=JSON.stringify(capture());

  if(history[historyIndex]===state) return;

  history=history.slice(0,historyIndex+1);
  history.push(state);

  if(history.length>80) history.shift();

  historyIndex=history.length-1;

  if(show) toastMsg("Saved");
}

function scheduleHistory(){
  clearTimeout(historyTimer);
  historyTimer=setTimeout(()=>saveHistory(false),500);
}

function restoreState(state){
  restoring=true;

  objects.slice().forEach(removeObject);
  objects=[];

  let data=[];
  try{data=JSON.parse(state)}catch{data=[]}

  data.forEach(item=>{
    if(item.type==="Light"){
      const light=new THREE.PointLight(
        item.color ?? 0xffffff,
        item.intensity ?? 5,
        item.distance ?? 25
      );

      light.name=item.name;
      light.userData.engine=true;
      light.userData.type="Light";
      light.userData.locked=!!item.locked;
      light.position.fromArray(item.position);
      light.rotation.fromArray(item.rotation);
      light.scale.fromArray(item.scale);
      light.visible=item.visible!==false;

      scene.add(light);
      objects.push(light);
      return;
    }

    const geo=geometryFor(item.type);
    const mesh=new THREE.Mesh(
      geo,
      makeMaterial(item.color ?? colorFor(item.type))
    );

    mesh.name=item.name;
    mesh.userData.engine=true;
    mesh.userData.type=item.type;
    mesh.userData.locked=!!item.locked;

    mesh.position.fromArray(item.position);
    mesh.rotation.fromArray(item.rotation);
    mesh.scale.fromArray(item.scale);
    mesh.visible=item.visible!==false;

    scene.add(mesh);
    objects.push(mesh);
  });

  selected=objects[0]||null;

  refreshSceneList();
  updateInspector();
  updateStatus();

  restoring=false;
}

function undo(){
  if(historyIndex<=0){
    toastMsg("Nothing to undo");
    return;
  }

  historyIndex--;
  restoreState(history[historyIndex]);
  toastMsg("Undo");
}

function redo(){
  if(historyIndex>=history.length-1){
    toastMsg("Nothing to redo");
    return;
  }

  historyIndex++;
  restoreState(history[historyIndex]);
  toastMsg("Redo");
}

/* ------------------------- SAVE / LOAD ------------------------- */

function projectData(){
  return {
    app:"Bird 3D Engine",
    version:3,
    objects:capture(),
    camera:{
      yaw:targetYaw,
      pitch:targetPitch,
      distance:targetDistance,
      target:targetCameraTarget.toArray()
    },
    grid:gridVisible,
    snap:snapEnabled
  };
}

function saveProject(){
  const data=projectData();
  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));

  const blob=new Blob(
    [JSON.stringify(data,null,2)],
    {type:"application/json"}
  );

  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="bird-3d-project.json";
  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(()=>URL.revokeObjectURL(url),1000);

  toastMsg("Project saved");
}

function loadProject(){
  const input=document.createElement("input");
  input.type="file";
  input.accept=".json,application/json";

  input.onchange=()=>{
    const file=input.files?.[0];
    if(!file) return;

    const reader=new FileReader();

    reader.onload=()=>{
      try{
        const data=JSON.parse(reader.result);

        if(!Array.isArray(data.objects)) throw new Error("bad project");

        restoreState(JSON.stringify(data.objects));

        if(data.camera){
          targetYaw=Number(data.camera.yaw)||.65;
          targetPitch=Number(data.camera.pitch)||.48;
          targetDistance=Number(data.camera.distance)||9;

          if(Array.isArray(data.camera.target)){
            targetCameraTarget.fromArray(data.camera.target);
          }
        }

        gridVisible=data.grid!==false;
        grid.visible=gridVisible;
        $("gridBtn").classList.toggle("active",gridVisible);

        snapEnabled=data.snap===true;
        $("snapBtn").textContent=snapEnabled?"🧲 Snap ON":"🧲 Snap OFF";
        $("snapBtn").classList.toggle("active",snapEnabled);

        history=[];
        historyIndex=-1;
        saveHistory(false);

        toastMsg("Project loaded");
      }catch(err){
        toastMsg("Invalid project file");
      }
    };

    reader.readAsText(file);
  };

  input.click();
}

function autoLoad(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw) return;

    const data=JSON.parse(raw);

    if(!Array.isArray(data.objects) || data.objects.length===0) return;

    restoreState(JSON.stringify(data.objects));

    if(data.camera){
      targetYaw=Number(data.camera.yaw)||.65;
      targetPitch=Number(data.camera.pitch)||.48;
      targetDistance=Number(data.camera.distance)||9;
      if(Array.isArray(data.camera.target)){
        targetCameraTarget.fromArray(data.camera.target);
      }
    }

    gridVisible=data.grid!==false;
    grid.visible=gridVisible;

    snapEnabled=data.snap===true;

    refreshSceneList();
    updateInspector();
    updateStatus();
  }catch{
    /* Ignore broken autosave. */
  }
}

function autoSave(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(projectData()));
  }catch{
    /* Storage can be unavailable in private browsing. */
  }
}

/* ------------------------- PLAY ------------------------- */

function togglePlay(){
  if(playing){
    stopPlay();
  }else{
    startPlay();
  }
}

function startPlay(){
  playing=true;
  // Play mode runs the scene animation without creating the unwanted mobile overlay.
  $("playOverlay").style.display="none";
  $("playBtn").textContent="⏹ Stop";
  toastMsg("Play mode");
}

function stopPlay(){
  playing=false;
  $("playOverlay").style.display="none";
  $("playBtn").textContent="▶ Play";
  toastMsg("Editor mode");
}

/* ------------------------- FULLSCREEN ------------------------- */

async function fullscreen(){
  try{
    if(document.fullscreenElement){
      await document.exitFullscreen();
      return;
    }

    if(document.documentElement.requestFullscreen){
      await document.documentElement.requestFullscreen();
      return;
    }

    if(renderer.domElement.webkitRequestFullscreen){
      renderer.domElement.webkitRequestFullscreen();
      return;
    }

    toastMsg("Use iPhone Share → Add to Home Screen");
  }catch{
    toastMsg("Fullscreen unavailable on this browser");
  }
}

/* ------------------------- UI ------------------------- */

function bindUI(){
  $("cameraBtn").onclick=()=>setMode("camera");
  $("moveBtn").onclick=()=>setMode("move");
  $("rotateBtn").onclick=()=>setMode("rotate");
  $("scaleBtn").onclick=()=>setMode("scale");

  $("addCubeBtn").onclick=()=>addPrimitive("Cube");
  $("addSphereBtn").onclick=()=>addPrimitive("Sphere");
  $("addCylinderBtn").onclick=()=>addPrimitive("Cylinder");
  $("addConeBtn").onclick=()=>addPrimitive("Cone");
  $("addPlaneBtn").onclick=()=>addPrimitive("Plane");
  $("addCapsuleBtn").onclick=()=>addPrimitive("Capsule");
  $("addTorusBtn").onclick=()=>addPrimitive("Torus");
  $("addLightBtn").onclick=addLight;

  $("duplicateBtn").onclick=duplicateSelected;
  $("deleteBtn").onclick=deleteSelected;

  $("undoBtn").onclick=undo;
  $("redoBtn").onclick=redo;

  $("playBtn").onclick=togglePlay;
  $("saveBtn").onclick=saveProject;
  $("loadBtn").onclick=loadProject;

  $("fullscreenBtn").onclick=fullscreen;
  $("playFullscreenBtn").onclick=fullscreen;
  $("stopPlayBtn").onclick=stopPlay;

  $("focusBtn").onclick=focusSelected;
  $("gridBtn").onclick=toggleGrid;
  $("snapBtn").onclick=toggleSnap;
  $("resetCameraBtn").onclick=resetCamera;

  setInterval(autoSave,5000);

  document.addEventListener("visibilitychange",()=>{
    if(document.hidden) autoSave();
  });

  autoLoad();
}

/* ------------------------- KEYBOARD ------------------------- */

function keyDown(e){
  const tag=e.target?.tagName;

  if(tag==="INPUT" || tag==="SELECT" || tag==="TEXTAREA"){
    return;
  }

  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="z"){
    e.preventDefault();
    if(e.shiftKey) redo();
    else undo();
  }

  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="y"){
    e.preventDefault();
    redo();
  }

  if(e.key==="Delete" || e.key==="Backspace"){
    deleteSelected();
  }

  if(e.key==="Escape" && playing){
    stopPlay();
  }

  if(e.key.toLowerCase()==="f"){
    focusSelected();
  }

  if(e.key.toLowerCase()==="r"){
    setMode("rotate");
  }

  if(e.key.toLowerCase()==="g"){
    setMode("move");
  }

  if(e.key.toLowerCase()==="s"){
    setMode("scale");
  }
}

/* ------------------------- ANIMATION ------------------------- */

function animate(){
  requestAnimationFrame(animate);

  updateCamera();

  if(playing){
    updatePlayAnimation();
  }

  renderer.render(scene,camera);
}

function updatePlayAnimation(){
  objects.forEach((o,index)=>{
    if(!o.visible || o.userData.type==="Light") return;

    if(o.userData.type==="Cube"){
      o.rotation.y += 0.003;
    }

    if(o.userData.type==="Torus"){
      o.rotation.x += 0.004;
      o.rotation.y += 0.003;
    }

    if(o.userData.type==="Sphere"){
      o.position.y += Math.sin(performance.now()*.002+index)*.0008;
    }
  });
}

/* ------------------------- RESIZE ------------------------- */

function resize(){
  if(!renderer || !camera) return;

  const w=Math.max(1,viewport.clientWidth);
  const h=Math.max(1,viewport.clientHeight);

  camera.aspect=w/h;
  camera.updateProjectionMatrix();

  renderer.setSize(w,h,false);
}

/* ------------------------- UTILITIES ------------------------- */

function clamp(v,min,max){
  return Math.max(min,Math.min(max,v));
}

function deg(rad){
  return Math.round(THREE.MathUtils.radToDeg(rad));
}

function oArray(v){
  return [v.x,v.y,v.z];
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[m]));
}

function escapeAttr(s){
  return escapeHtml(s);
}

function toastMsg(text){
  toast.textContent=text;
  toast.style.display="block";

  clearTimeout(toast._timer);

  toast._timer=setTimeout(()=>{
    toast.style.display="none";
  },1200);
}

/* ------------------------- BOOT ------------------------- */

start();
</script>
