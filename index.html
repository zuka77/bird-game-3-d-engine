<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0f15">
<title>Bird 3D Engine — Mobile Edition</title>
<style>
:root{
  --bg:#0b0f15;--panel:#141a23;--panel2:#1b222d;--line:#2c3542;
  --text:#f4f7fb;--muted:#8792a2;--accent:#35d477;--danger:#b43a45;
  --shadow:0 10px 35px #0008;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{overscroll-behavior:none}
button,input,select{font:inherit}
button{border:0;border-radius:10px;background:#252d39;color:#fff;padding:9px 11px;font-weight:700;white-space:nowrap}
button:active{transform:scale(.97)}
button.active{background:var(--accent);color:#06130b}
button.danger{background:var(--danger)}
button.ghost{background:transparent;border:1px solid var(--line)}
button:disabled{opacity:.4}
input,select{width:100%;border:1px solid var(--line);border-radius:8px;background:#0e131b;color:#fff;padding:8px;outline:none}
input[type=color]{height:38px;padding:3px}
#app{width:100%;height:100dvh;display:flex;flex-direction:column}
#topbar{height:56px;min-height:56px;display:flex;align-items:center;gap:7px;padding:6px 8px;background:#151a22;border-bottom:1px solid var(--line);z-index:100}
.logo{font-weight:900;font-size:14px;white-space:nowrap}
#toolbar{display:flex;gap:5px;overflow:auto;scrollbar-width:none;min-width:0}
#toolbar::-webkit-scrollbar{display:none}
#workspace{flex:1;min-height:0;display:grid;grid-template-columns:170px minmax(0,1fr) 215px}
.panel{min-width:0;min-height:0;background:var(--panel);overflow:auto}
.left{border-right:1px solid var(--line)}
.right{border-left:1px solid var(--line)}
.panelInner{padding:10px}
.sectionTitle{font-size:10px;font-weight:900;letter-spacing:1.4px;color:var(--muted);margin:5px 0 9px}
#sceneList{display:flex;flex-direction:column;gap:4px}
.sceneItem{display:flex;align-items:center;gap:5px;min-height:32px;padding:7px 8px;border-radius:8px;background:#202733;font-size:11px;cursor:pointer}
.sceneItem.selected{background:var(--accent);color:#05120a}
.sceneItem.hidden{opacity:.45}
.sceneIcon{width:18px;text-align:center}
.sceneName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
#viewport{position:relative;min-width:0;min-height:0;overflow:hidden;background:#080b10}
#viewport canvas{display:block;width:100%;height:100%;touch-action:none}
.overlay{position:absolute;z-index:20;pointer-events:none}
.badge{background:#141a22dd;border:1px solid #34404e;border-radius:9px;padding:7px 9px;font-size:10px}
#viewBadge{left:9px;top:9px}
#modeBadge{right:9px;top:9px}
#hint{left:50%;bottom:9px;transform:translateX(-50%);max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast{left:50%;bottom:50px;transform:translateX(-50%);background:#252e3bdd;border:1px solid #3b4655;border-radius:10px;padding:9px 13px;font-size:11px;display:none}
#stats{right:9px;bottom:9px}
#inspector{padding:10px}
.row{display:flex;gap:6px;margin-bottom:7px}.row>*{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.label{font-size:9px;color:var(--muted);margin:7px 0 4px}
.valueLabel{font-size:9px;color:var(--muted)}
.card{background:#1b222d;border:1px solid #293341;border-radius:10px;padding:8px;margin-bottom:8px}
.toolGroup{display:flex;gap:5px;flex-wrap:wrap}
.toolGroup button{flex:1}
#playOverlay{position:absolute;inset:0;z-index:80;background:#000;display:none}
#playCanvas{width:100%;height:100%}
#playBar{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:90}
#mobilePad{display:none;position:absolute;z-index:91;left:15px;bottom:18px;width:145px;height:145px}
.joyBase{position:absolute;inset:20px;border:2px solid #ffffff33;border-radius:50%;background:#ffffff0d}
#joyKnob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:#ffffff22;border:1px solid #ffffff44}
#lookPad{display:none;position:absolute;right:0;top:0;width:55%;height:100%;z-index:89}
#mobileTools{display:none;position:absolute;right:10px;bottom:15px;z-index:92;gap:5px;flex-direction:column}
#mobileTools button{width:44px;height:44px;padding:0}
#fullscreenExit{display:none;position:fixed;right:10px;top:calc(10px + env(safe-area-inset-top));z-index:10000}
.engineFS #fullscreenExit{display:block}
.engineFS #app{position:fixed;inset:0;width:100vw;height:100dvh;z-index:9990}
.engineFS #topbar,.engineFS .left,.engineFS .right{display:none}
.engineFS #workspace{display:block;width:100%;height:100%}
.engineFS #viewport{position:fixed;inset:0;width:100vw;height:100dvh}
.hidden{display:none!important}
@media(max-width:900px){
  #workspace{grid-template-columns:100px minmax(0,1fr) 150px}
  .panelInner{padding:7px}
  button{font-size:10px;padding:8px 9px}
  .logo{font-size:12px}
}
@media(max-width:650px){
  #topbar{height:50px;min-height:50px}
  #workspace{grid-template-columns:72px minmax(0,1fr)}
  .right{display:none}
  .panelInner{padding:5px}
  .sectionTitle{font-size:8px}
  .sceneItem{font-size:8px;padding:7px 4px}
  #hint{font-size:8px}
  #mobilePad,#lookPad,#mobileTools{display:block}
}
@media(max-width:650px) and (orientation:landscape){
  #topbar{height:45px;min-height:45px}
  #workspace{grid-template-columns:78px minmax(0,1fr)}
  #mobilePad{transform:scale(.78);transform-origin:bottom left;bottom:4px}
  #mobileTools{bottom:7px}
}
</style>
</head>
<body>
<div id="app">
<header id="topbar">
  <div class="logo">🐦 BIRD ENGINE</div>
  <div id="toolbar">
    <button id="cameraBtn" class="active">🎥 Camera</button>
    <button id="moveBtn">✋ Move</button>
    <button id="rotateBtn">🔄 Rotate</button>
    <button id="scaleBtn">📏 Scale</button>
    <button id="cubeBtn">＋ Cube</button>
    <button id="sphereBtn">＋ Sphere</button>
    <button id="cylinderBtn">＋ Cylinder</button>
    <button id="coneBtn">＋ Cone</button>
    <button id="planeBtn">＋ Plane</button>
    <button id="capsuleBtn">＋ Capsule</button>
    <button id="torusBtn">＋ Torus</button>
    <button id="lightBtn">＋ Light</button>
    <button id="duplicateBtn">📋 Duplicate</button>
    <button id="deleteBtn" class="danger">🗑 Delete</button>
    <button id="focusBtn">🎯 Focus</button>
    <button id="undoBtn">↶</button>
    <button id="redoBtn">↷</button>
    <button id="playBtn">▶ Play</button>
    <button id="saveBtn">💾 Save</button>
    <button id="loadBtn">📂 Load</button>
    <button id="shotBtn">📸</button>
    <button id="fullscreenBtn">⛶ Fullscreen</button>
  </div>
</header>

<div id="workspace">
  <aside class="panel left">
    <div class="panelInner">
      <div class="sectionTitle">SCENE</div>
      <div id="sceneList"></div>
      <div class="sectionTitle">TOOLS</div>
      <div class="toolGroup">
        <button id="snapBtn">🧲 Snap OFF</button>
        <button id="gridBtn">▦ Grid</button>
      </div>
    </div>
  </aside>

  <main id="viewport">
    <div id="viewBadge" class="overlay badge">3D VIEW</div>
    <div id="modeBadge" class="overlay badge">🎥 CAMERA</div>
    <div id="stats" class="overlay badge">0 objects</div>
    <div id="hint" class="overlay badge">👆 Drag camera • 🤏 Pinch zoom • 2 fingers pan</div>
    <div id="toast" class="overlay"></div>

    <div id="playOverlay">
      <canvas id="playCanvas"></canvas>
      <div id="playBar">
        <button id="stopBtn" class="danger">⏹ Stop</button>
        <button id="playFullBtn">⛶ Fullscreen</button>
      </div>
      <div id="mobilePad">
        <div class="joyBase"></div><div id="joyKnob"></div>
      </div>
      <div id="lookPad"></div>
      <div id="mobileTools">
        <button id="jumpBtn">⬆</button>
        <button id="playFocusBtn">🎯</button>
      </div>
    </div>
  </main>

  <aside class="panel right">
    <div id="inspector"></div>
  </aside>
</div>
</div>

<button id="fullscreenExit" class="danger">✕ Exit Fullscreen</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
"use strict";

/* ============================================================
   BIRD 3D ENGINE — COMPLETE SINGLE FILE EDITOR
   ============================================================
   Core:
   - Mobile-first 3D editor
   - Orbit / pan / pinch camera
   - Move / rotate / scale modes
   - Primitive creation
   - Selection / hierarchy
   - Inspector
   - Duplicate / delete / hide / lock
   - Undo / redo
   - Snap
   - Save / load JSON
   - Screenshot
   - Fullscreen fallback for iPhone
   - Play mode
   - Mobile play controls
   - Local autosave
   - Grid and lighting
   ============================================================ */

const $ = id => document.getElementById(id);

const UI = {
  viewport:$("viewport"),
  sceneList:$("sceneList"),
  inspector:$("inspector"),
  modeBadge:$("modeBadge"),
  toast:$("toast"),
  stats:$("stats"),
  playOverlay:$("playOverlay"),
  playCanvas:$("playCanvas"),
  mobilePad:$("mobilePad"),
  joyKnob:$("joyKnob"),
  lookPad:$("lookPad")
};

let scene = null;
let camera = null;
let renderer = null;
let raycaster = null;

let playScene = null;
let playCamera = null;
let playRenderer = null;

let objects = [];
let selected = null;
let mode = "camera";
let isPlaying = false;

let gridVisible = true;
let snapEnabled = false;
let snapSize = 0.25;

let cameraYaw = 0.65;
let cameraPitch = 0.45;
let cameraDistance = 8;
let targetYaw = 0.65;
let targetPitch = 0.45;
let targetDistance = 8;
let cameraTarget = new THREE.Vector3(0,0.7,0);
let targetCameraTarget = new THREE.Vector3(0,0.7,0);

let pointers = new Map();
let lastX = 0;
let lastY = 0;
let pinchStart = 0;
let pinchDistanceStart = 8;
let lastMid = null;

let dragStart = null;

let history = [];
let historyIndex = -1;
let historyLock = false;
const MAX_HISTORY = 80;

let gridHelper = null;
let ground = null;
let sunLight = null;
let hemiLight = null;

let playClock = null;
let playObjects = [];
let player = {
  position:new THREE.Vector3(0,1.2,5),
  yaw:0,
  pitch:0,
  velocityY:0,
  speed:4,
  onGround:true
};

let joystick = {
  active:false,
  pointerId:null,
  x:0,
  y:0
};

let playLook = {
  active:false,
  pointerId:null,
  x:0,
  y:0
};

let fpsFrames = 0;
let fpsTime = performance.now();
let fps = 0;

/* ============================================================
   INITIALIZATION
   ============================================================ */

function init(){
  createEditorScene();
  createEditorCamera();
  createRenderer();
  createLights();
  createGround();
  createGrid();

  raycaster = new THREE.Raycaster();

  createCube(false);
  selectObject(objects[0] || null);

  bindEditorEvents();
  bindPlayEvents();

  updateModeUI();
  updateInspector();
  updateStats();
  resize();

  saveHistory(false);
  autoSave();

  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(resize, 180));
  document.addEventListener("fullscreenchange", onFullscreenChange);
  document.addEventListener("visibilitychange", onVisibilityChange);
  window.addEventListener("keydown", onKeyDown);

  animate();
}

function createEditorScene(){
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x10151d);
}

function createEditorCamera(){
  camera = new THREE.PerspectiveCamera(
    60,
    1,
    0.01,
    5000
  );
}

function createRenderer(){
  renderer = new THREE.WebGLRenderer({
    antialias:true,
    alpha:false,
    preserveDrawingBuffer:true
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1,2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  UI.viewport.appendChild(renderer.domElement);
}

function createLights(){
  hemiLight = new THREE.HemisphereLight(0xffffff,0x304030,2);
  hemiLight.name = "World Light";
  hemiLight.userData.editorHelper = true;
  scene.add(hemiLight);

  sunLight = new THREE.DirectionalLight(0xffffff,2.2);
  sunLight.position.set(8,12,6);
  sunLight.name = "Sun Light";
  sunLight.userData.editorHelper = true;
  scene.add(sunLight);
}

function createGround(){
  ground = new THREE.Mesh(
    new THREE.PlaneGeometry(100,100),
    new THREE.MeshStandardMaterial({
      color:0x31513b,
      roughness:1,
      metalness:0
    })
  );
  ground.rotation.x = -Math.PI/2;
  ground.name = "Ground";
  ground.userData.engine = true;
  ground.userData.type = "Ground";
  ground.userData.locked = true;
  ground.userData.system = true;
  scene.add(ground);
}

function createGrid(){
  gridHelper = new THREE.GridHelper(
    100,
    100,
    0x506070,
    0x29313c
  );
  gridHelper.position.y = 0.002;
  gridHelper.name = "Editor Grid";
  gridHelper.userData.editorHelper = true;
  scene.add(gridHelper);
}

/* ============================================================
   MATERIALS / GEOMETRY
   ============================================================ */

function makeMaterial(color){
  return new THREE.MeshStandardMaterial({
    color:color,
    roughness:0.72,
    metalness:0.05
  });
}

function createGeometry(type){
  switch(type){
    case "Cube":
      return new THREE.BoxGeometry(1.5,1.5,1.5);

    case "Sphere":
      return new THREE.SphereGeometry(0.9,32,20);

    case "Cylinder":
      return new THREE.CylinderGeometry(0.8,0.8,1.6,32);

    case "Cone":
      return new THREE.ConeGeometry(0.9,1.8,32);

    case "Plane":
      return new THREE.PlaneGeometry(2,2);

    case "Capsule":
      return new THREE.CapsuleGeometry(0.55,1.2,8,20);

    case "Torus":
      return new THREE.TorusGeometry(0.8,0.25,18,40);

    default:
      return new THREE.BoxGeometry(1,1,1);
  }
}

function defaultColor(type){
  const colors = {
    Cube:0x28aef0,
    Sphere:0xffb52e,
    Cylinder:0x9b6cff,
    Cone:0xff5f75,
    Plane:0x45d18a,
    Capsule:0x40d6cf,
    Torus:0xf0d64a
  };
  return colors[type] || 0xffffff;
}

function createPrimitive(type, select=true){
  const mesh = new THREE.Mesh(
    createGeometry(type),
    makeMaterial(defaultColor(type))
  );

  mesh.userData.engine = true;
  mesh.userData.type = type;
  mesh.userData.locked = false;
  mesh.userData.hidden = false;
  mesh.name = uniqueName(type);

  placeNewObject(mesh,type);

  scene.add(mesh);
  objects.push(mesh);

  addSceneItem(mesh);

  if(select){
    selectObject(mesh);
    focusObject(mesh,false);
  }

  saveHistory(false);
  updateStats();

  return mesh;
}

function placeNewObject(mesh,type){
  const p = new THREE.Vector3(
    randomPosition(),
    defaultHeight(type),
    randomPosition()
  );

  mesh.position.copy(p);

  if(type === "Plane"){
    mesh.rotation.x = -Math.PI/2;
  }
}

function defaultHeight(type){
  switch(type){
    case "Cube":return 0.75;
    case "Sphere":return 0.9;
    case "Cylinder":return 0.8;
    case "Cone":return 0.9;
    case "Plane":return 0.02;
    case "Capsule":return 1;
    case "Torus":return 0.8;
    default:return 0.75;
  }
}

function randomPosition(){
  return Math.random()*4-2;
}

function uniqueName(type){
  let n = 1;
  while(objects.some(o => o.name === type+" "+n)){
    n++;
  }
  return type+" "+n;
}

/* Compatibility helpers matching the original version. */

function createCube(select=true){
  return createPrimitive("Cube",select);
}

function createSphere(select=true){
  return createPrimitive("Sphere",select);
}

function createCylinder(select=true){
  return createPrimitive("Cylinder",select);
}

function createCone(select=true){
  return createPrimitive("Cone",select);
}

function createPlane(select=true){
  return createPrimitive("Plane",select);
}

function createCapsule(select=true){
  return createPrimitive("Capsule",select);
}

function createTorus(select=true){
  return createPrimitive("Torus",select);
}

/* ============================================================
   HIERARCHY
   ============================================================ */

function addSceneItem(obj){
  const el = document.createElement("div");
  el.className = "sceneItem";

  const icon = document.createElement("span");
  icon.className = "sceneIcon";
  icon.textContent = objectIcon(obj.userData.type);

  const name = document.createElement("span");
  name.className = "sceneName";
  name.textContent = obj.name;

  el.appendChild(icon);
  el.appendChild(name);

  el.addEventListener("click",() => {
    selectObject(obj);
  });

  obj.userData.listItem = el;
  UI.sceneList.appendChild(el);

  refreshSceneItem(obj);
}

function objectIcon(type){
  const icons = {
    Cube:"🟦",
    Sphere:"🟠",
    Cylinder:"🟣",
    Cone:"🔻",
    Plane:"🟩",
    Capsule:"🟦",
    Torus:"⭕",
    Ground:"🌱"
  };
  return icons[type] || "◼";
}

function refreshSceneItem(obj){
  const el = obj?.userData?.listItem;
  if(!el)return;

  el.classList.toggle("selected",obj === selected);
  el.classList.toggle("hidden",!obj.visible);

  const icon = el.querySelector(".sceneIcon");
  if(icon)icon.textContent = objectIcon(obj.userData.type);

  const name = el.querySelector(".sceneName");
  if(name)name.textContent = obj.name;
}

function refreshSceneList(){
  UI.sceneList.innerHTML = "";

  objects.forEach(obj => {
    obj.userData.listItem = null;
    addSceneItem(obj);
  });

  if(selected){
    refreshSceneItem(selected);
  }
}

/* ============================================================
   SELECTION
   ============================================================ */

function selectObject(obj){
  selected = obj || null;

  objects.forEach(o => {
    refreshSceneItem(o);
  });

  updateInspector();
}

function clearSelection(){
  selected = null;
  updateInspector();
  objects.forEach(refreshSceneItem);
}

function updateInspector(){
  if(!selected){
    UI.inspector.innerHTML = `
      <div class="sectionTitle">OBJECT</div>
      <div class="card">
        <div class="valueLabel">
          Select an object in the scene.
        </div>
      </div>
      <div class="sectionTitle">WORLD</div>
      <div class="card">
        <div class="label">BACKGROUND</div>
        <input id="worldColor" type="color" value="#10151d">
        <div class="row">
          <button id="resetCameraBtn">Reset Camera</button>
          <button id="saveLocalBtn">Local Save</button>
        </div>
      </div>
    `;

    $("worldColor").oninput = e => {
      scene.background.set(e.target.value);
    };

    $("resetCameraBtn").onclick = resetCamera;
    $("saveLocalBtn").onclick = () => {
      localStorage.setItem("birdEngineScene",JSON.stringify({
        version:2,
        scene:snapshot()
      }));
      toastMsg("Saved locally");
    };

    return;
  }

  const c = selected.material?.color?.getHexString?.() || "ffffff";

  UI.inspector.innerHTML = `
    <div class="sectionTitle">OBJECT</div>

    <div class="card">
      <div class="label">NAME</div>
      <input id="nameField" value="${escapeAttr(selected.name)}">

      <div class="label">COLOR</div>
      <input id="colorField" type="color" value="#${c}">

      <div class="row">
        <button id="hideBtn">${selected.visible?"👁 Hide":"👁 Show"}</button>
        <button id="lockBtn">${selected.userData.locked?"🔒 Locked":"🔓 Lock"}</button>
      </div>
    </div>

    <div class="sectionTitle">TRANSFORM</div>

    <div class="card">
      <div class="label">POSITION</div>
      <div class="grid3">
        <input id="px" type="number" step="0.01" value="${selected.position.x.toFixed(2)}">
        <input id="py" type="number" step="0.01" value="${selected.position.y.toFixed(2)}">
        <input id="pz" type="number" step="0.01" value="${selected.position.z.toFixed(2)}">
      </div>

      <div class="label">ROTATION °</div>
      <div class="grid3">
        <input id="rx" type="number" step="1" value="${radToDeg(selected.rotation.x).toFixed(0)}">
        <input id="ry" type="number" step="1" value="${radToDeg(selected.rotation.y).toFixed(0)}">
        <input id="rz" type="number" step="1" value="${radToDeg(selected.rotation.z).toFixed(0)}">
      </div>

      <div class="label">SCALE</div>
      <div class="grid3">
        <input id="sx" type="number" step="0.01" value="${selected.scale.x.toFixed(2)}">
        <input id="sy" type="number" step="0.01" value="${selected.scale.y.toFixed(2)}">
        <input id="sz" type="number" step="0.01" value="${selected.scale.z.toFixed(2)}">
      </div>

      <div class="row">
        <button id="applyTransform">Apply</button>
        <button id="resetTransform" class="ghost">Reset</button>
      </div>
    </div>

    <div class="sectionTitle">ACTIONS</div>

    <div class="card">
      <div class="row">
        <button id="dupInspector">📋 Duplicate</button>
        <button id="focusInspector">🎯 Focus</button>
      </div>
      <button id="deleteInspector" class="danger" style="width:100%">🗑 Delete Object</button>
    </div>
  `;

  $("nameField").onchange = e => {
    const old = selected.name;
    const value = e.target.value.trim();

    if(value){
      selected.name = value;
      refreshSceneList();
      saveHistory(false);
      toastMsg(old+" → "+value);
    }
  };

  $("colorField").oninput = e => {
    if(selected.material?.color){
      selected.material.color.set(e.target.value);
    }
  };

  $("colorField").onchange = () => saveHistory(false);

  $("hideBtn").onclick = () => {
    selected.visible = !selected.visible;
    refreshSceneList();
    updateInspector();
    saveHistory(false);
  };

  $("lockBtn").onclick = () => {
    selected.userData.locked = !selected.userData.locked;
    updateInspector();
    saveHistory(false);
  };

  $("applyTransform").onclick = applyInspectorTransform;
  $("resetTransform").onclick = resetSelectedTransform;
  $("dupInspector").onclick = duplicateSelected;
  $("focusInspector").onclick = () => focusObject(selected,true);
  $("deleteInspector").onclick = deleteSelected;
}

function applyInspectorTransform(){
  if(!selected || selected.userData.locked)return;

  selected.position.set(
    readNumber("px",selected.position.x),
    readNumber("py",selected.position.y),
    readNumber("pz",selected.position.z)
  );

  selected.rotation.set(
    degToRad(readNumber("rx",radToDeg(selected.rotation.x))),
    degToRad(readNumber("ry",radToDeg(selected.rotation.y))),
    degToRad(readNumber("rz",radToDeg(selected.rotation.z)))
  );

  selected.scale.set(
    Math.max(0.01,readNumber("sx",selected.scale.x)),
    Math.max(0.01,readNumber("sy",selected.scale.y)),
    Math.max(0.01,readNumber("sz",selected.scale.z))
  );

  snapObjectIfNeeded(selected);
  updateInspector();
  saveHistory(false);
  toastMsg("Transform applied");
}

function resetSelectedTransform(){
  if(!selected || selected.userData.locked)return;

  selected.position.set(0,defaultHeight(selected.userData.type),0);
  selected.rotation.set(
    selected.userData.type === "Plane" ? -Math.PI/2 : 0,
    0,
    0
  );
  selected.scale.set(1,1,1);

  updateInspector();
  saveHistory(false);
}

function readNumber(id,fallback){
  const value = parseFloat($(id)?.value);
  return Number.isFinite(value) ? value : fallback;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[m]));
}

function escapeAttr(s){
  return escapeHtml(s);
}

/* ============================================================
   EDITOR POINTER INPUT
   ============================================================ */

function bindEditorEvents(){
  const c = renderer.domElement;

  c.addEventListener("pointerdown",onEditorPointerDown,{passive:false});
  c.addEventListener("pointermove",onEditorPointerMove,{passive:false});
  c.addEventListener("pointerup",onEditorPointerUp,{passive:false});
  c.addEventListener("pointercancel",onEditorPointerUp,{passive:false});
  c.addEventListener("wheel",onEditorWheel,{passive:false});

  $("cameraBtn").onclick = () => setMode("camera");
  $("moveBtn").onclick = () => setMode("move");
  $("rotateBtn").onclick = () => setMode("rotate");
  $("scaleBtn").onclick = () => setMode("scale");

  $("cubeBtn").onclick = () => createCube();
  $("sphereBtn").onclick = () => createSphere();
  $("cylinderBtn").onclick = () => createCylinder();
  $("coneBtn").onclick = () => createCone();
  $("planeBtn").onclick = () => createPlane();
  $("capsuleBtn").onclick = () => createCapsule();
  $("torusBtn").onclick = () => createTorus();

  $("lightBtn").onclick = addPointLight;
  $("duplicateBtn").onclick = duplicateSelected;
  $("deleteBtn").onclick = deleteSelected;
  $("focusBtn").onclick = () => focusObject(selected,true);

  $("undoBtn").onclick = undo;
  $("redoBtn").onclick = redo;

  $("playBtn").onclick = togglePlay;
  $("saveBtn").onclick = saveToFile;
  $("loadBtn").onclick = loadFromFile;
  $("shotBtn").onclick = takeScreenshot;
  $("fullscreenBtn").onclick = toggleFullscreen;

  $("fullscreenExit").onclick = exitFullscreen;

  $("snapBtn").onclick = toggleSnap;
  $("gridBtn").onclick = toggleGrid;

  document.addEventListener("contextmenu",e => {
    if(e.target === renderer.domElement){
      e.preventDefault();
    }
  });
}

function onEditorPointerDown(e){
  e.preventDefault();

  const canvas = renderer.domElement;

  try{
    canvas.setPointerCapture(e.pointerId);
  }catch{}

  pointers.set(e.pointerId,{
    x:e.clientX,
    y:e.clientY
  });

  if(pointers.size === 2){
    const p = [...pointers.values()];
    pinchStart = distance2D(p[0],p[1]);
    pinchDistanceStart = targetDistance;
    lastMid = midpoint(p[0],p[1]);
    return;
  }

  lastX = e.clientX;
  lastY = e.clientY;

  if(mode === "camera"){
    const hit = pickObject(e.clientX,e.clientY);

    if(hit){
      selectObject(hit);
    }
    return;
  }

  if(!selected || selected.userData.locked){
    return;
  }

  const hit = pickObject(e.clientX,e.clientY);

  if(hit){
    selectObject(hit);

    dragStart = {
      x:e.clientX,
      y:e.clientY,
      px:selected.position.x,
      py:selected.position.y,
      pz:selected.position.z,
      rx:selected.rotation.x,
      ry:selected.rotation.y,
      rz:selected.rotation.z,
      sx:selected.scale.x,
      sy:selected.scale.y,
      sz:selected.scale.z
    };
  }
}

function onEditorPointerMove(e){
  e.preventDefault();

  if(!pointers.has(e.pointerId)){
    return;
  }

  pointers.set(e.pointerId,{
    x:e.clientX,
    y:e.clientY
  });

  if(mode === "camera"){
    if(pointers.size >= 2){
      updatePinchAndPan();
      return;
    }

    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;

    targetYaw -= dx * 0.008;
    targetPitch -= dy * 0.008;

    clampCameraPitch();

    lastX = e.clientX;
    lastY = e.clientY;

    return;
  }

  if(!selected || selected.userData.locked){
    return;
  }

  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;

  if(mode === "move"){
    applyMoveDrag(dx,dy);
  }

  if(mode === "rotate"){
    applyRotateDrag(dx,dy);
  }

  if(mode === "scale"){
    applyScaleDrag(dy);
  }

  lastX = e.clientX;
  lastY = e.clientY;

  updateInspector();
}

function onEditorPointerUp(e){
  e.preventDefault();

  pointers.delete(e.pointerId);

  if(pointers.size < 2){
    pinchStart = 0;
    lastMid = null;
  }

  if(dragStart){
    snapObjectIfNeeded(selected);
    saveHistory(false);
    dragStart = null;
  }
}

function onEditorWheel(e){
  e.preventDefault();

  const amount = Math.exp(e.deltaY * 0.0012);

  targetDistance *= amount;
  targetDistance = clamp(targetDistance,0.15,500);
}

function applyMoveDrag(dx,dy){
  const speed = Math.max(0.002,cameraDistance*0.003);

  if(snapEnabled){
    selected.position.x += dx*speed;
    selected.position.y -= dy*speed;
  }else{
    selected.position.x += dx*speed;
    selected.position.y -= dy*speed;
  }

  if(selected.position.y < 0){
    selected.position.y = 0;
  }
}

function applyRotateDrag(dx,dy){
  const s = 0.012;

  selected.rotation.x += dy*s;
  selected.rotation.y += dx*s;
  selected.rotation.z += (dx-dy)*s*0.42;
}

function applyScaleDrag(dy){
  const factor = Math.exp(-dy*0.01);

  selected.scale.multiplyScalar(factor);

  selected.scale.x = clamp(selected.scale.x,0.01,100);
  selected.scale.y = clamp(selected.scale.y,0.01,100);
  selected.scale.z = clamp(selected.scale.z,0.01,100);
}

function updatePinchAndPan(){
  const p = [...pointers.values()];

  if(p.length < 2){
    return;
  }

  const d = distance2D(p[0],p[1]);

  if(pinchStart > 0){
    targetDistance =
      pinchDistanceStart * (pinchStart / Math.max(d,1));

    targetDistance = clamp(targetDistance,0.15,500);
  }

  const mid = midpoint(p[0],p[1]);

  if(lastMid){
    const dx = mid.x-lastMid.x;
    const dy = mid.y-lastMid.y;

    targetYaw -= dx*0.002;
    targetPitch += dy*0.0015;

    clampCameraPitch();
  }

  lastMid = mid;
}

function distance2D(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y);
}

function midpoint(a,b){
  return {
    x:(a.x+b.x)/2,
    y:(a.y+b.y)/2
  };
}

/* ============================================================
   CAMERA
   ============================================================ */

function updateCamera(){
  cameraYaw = damp(cameraYaw,targetYaw,0.14);
  cameraPitch = damp(cameraPitch,targetPitch,0.14);
  cameraDistance = damp(cameraDistance,targetDistance,0.16);

  cameraTarget.lerp(targetCameraTarget,0.14);

  const horizontal = Math.cos(cameraPitch)*cameraDistance;

  camera.position.x =
    cameraTarget.x +
    Math.sin(cameraYaw)*horizontal;

  camera.position.z =
    cameraTarget.z +
    Math.cos(cameraYaw)*horizontal;

  camera.position.y =
    cameraTarget.y +
    Math.sin(cameraPitch)*cameraDistance;

  camera.lookAt(cameraTarget);
}

function clampCameraPitch(){
  targetPitch = clamp(
    targetPitch,
    -1.54,
    1.54
  );
}

function resetCamera(){
  targetYaw = 0.65;
  targetPitch = 0.45;
  targetDistance = 8;

  targetCameraTarget.set(0,0.7,0);

  toastMsg("Camera reset");
}

function focusObject(obj,show=true){
  if(!obj){
    return;
  }

  const box = new THREE.Box3().setFromObject(obj);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());

  targetCameraTarget.copy(center);

  const maxSize = Math.max(size.x,size.y,size.z,1);
  targetDistance = clamp(maxSize*3.5,2,100);

  if(show){
    toastMsg("Focused: "+obj.name);
  }
}

/* ============================================================
   PICKING
   ============================================================ */

function pickObject(clientX,clientY){
  const rect = renderer.domElement.getBoundingClientRect();

  const x =
    ((clientX-rect.left)/rect.width)*2-1;

  const y =
    -((clientY-rect.top)/rect.height)*2+1;

  raycaster.setFromCamera(
    {x:x,y:y},
    camera
  );

  const visibleObjects =
    objects.filter(o =>
      o.visible &&
      !o.userData.system &&
      !o.userData.editorHelper
    );

  const hits =
    raycaster.intersectObjects(
      visibleObjects,
      true
    );

  if(!hits.length){
    return null;
  }

  let hit = hits[0].object;

  while(hit.parent && !objects.includes(hit)){
    hit = hit.parent;
  }

  return objects.includes(hit) ? hit : null;
}

/* ============================================================
   OBJECT ACTIONS
   ============================================================ */

function duplicateSelected(){
  if(!selected || selected.userData.locked){
    return;
  }

  const source = selected;

  const clone = source.clone(true);

  clone.name = uniqueName(
    source.userData.type || "Object"
  );

  clone.position.x += 1;
  clone.position.z += 1;

  clone.userData = {
    ...source.userData,
    listItem:null,
    locked:false
  };

  scene.add(clone);
  objects.push(clone);

  addSceneItem(clone);
  selectObject(clone);

  saveHistory(false);
  updateStats();

  toastMsg("Duplicated");
}

function deleteSelected(){
  if(!selected || selected.userData.locked){
    return;
  }

  const deleted = selected;

  disposeObject(deleted);

  selected = null;

  refreshSceneList();
  updateInspector();
  saveHistory(false);
  updateStats();

  toastMsg("Deleted");
}

function disposeObject(obj){
  if(!obj){
    return;
  }

  scene.remove(obj);

  if(obj.geometry){
    obj.geometry.dispose();
  }

  disposeMaterial(obj.material);

  objects = objects.filter(o => o !== obj);
}

function disposeMaterial(material){
  if(!material){
    return;
  }

  if(Array.isArray(material)){
    material.forEach(disposeMaterial);
    return;
  }

  material.dispose();
}

function addPointLight(){
  const light = new THREE.PointLight(
    0xffffff,
    4,
    30
  );

  light.position.set(2,4,2);
  light.name = uniqueName("Light");

  light.userData.engine = true;
  light.userData.type = "Light";
  light.userData.locked = false;
  light.userData.system = false;

  scene.add(light);
  objects.push(light);

  addSceneItem(light);
  selectObject(light);

  saveHistory(false);
  updateStats();
}

   SNAP / GRID
   ============================================================ */

function toggleSnap(){
  snapEnabled = !snapEnabled;

  $("snapBtn").textContent =
    snapEnabled ? "🧲 Snap ON" : "🧲 Snap OFF";

  toastMsg(
    snapEnabled
    ? "Snap enabled"
    : "Snap disabled"
  );
}

function toggleGrid(){
  gridVisible = !gridVisible;

  if(gridHelper){
    gridHelper.visible = gridVisible;
  }

  toastMsg(
    gridVisible
    ? "Grid visible"
    : "Grid hidden"
  );
}

function snapValue(value){
  if(!snapEnabled){
    return value;
  }

  return Math.round(value/snapSize)*snapSize;
}

function snapObjectIfNeeded(obj){
  if(!obj || !snapEnabled){
    return;
  }

  obj.position.x = snapValue(obj.position.x);
  obj.position.y = snapValue(obj.position.y);
  obj.position.z = snapValue(obj.position.z);

  obj.rotation.x = snapRotation(obj.rotation.x);
  obj.rotation.y = snapRotation(obj.rotation.y);
  obj.rotation.z = snapRotation(obj.rotation.z);
}

function snapRotation(value){
  const step = THREE.MathUtils.degToRad(15);
  return Math.round(value/step)*step;
}

/* ============================================================
   HISTORY
   ============================================================ */

function snapshot(){
  return objects.map(obj => {
    const type = obj.userData.type;

    if(type === "Light"){
      return {
        name:obj.name,
        type:"Light",
        position:obj.position.toArray(),
        rotation:obj.rotation.toArray(),
        scale:obj.scale.toArray(),
        color:obj.color?.getHex?.() ?? 0xffffff,
        intensity:obj.intensity ?? 1,
        distance:obj.distance ?? 0,
        visible:obj.visible,
        locked:!!obj.userData.locked
      };
    }

    return {
      name:obj.name,
      type:type,
      position:obj.position.toArray(),
      rotation:obj.rotation.toArray(),
      scale:obj.scale.toArray(),
      color:obj.material?.color?.getHex?.() ?? 0xffffff,
      visible:obj.visible,
      locked:!!obj.userData.locked
    };
  });
}

function saveHistory(show=true){
  if(historyLock){
    return;
  }

  const state = JSON.stringify(snapshot());

  if(history[historyIndex] === state){
    return;
  }

  if(historyIndex < history.length-1){
    history = history.slice(0,historyIndex+1);
  }

  history.push(state);

  if(history.length > MAX_HISTORY){
    history.shift();
  }

  historyIndex = history.length-1;

  if(show){
    toastMsg("Saved state");
  }
}

function undo(){
  if(historyIndex <= 0){
    return;
  }

  historyIndex--;

  restoreState(
    history[historyIndex]
  );

  toastMsg("Undo");
}

function redo(){
  if(historyIndex >= history.length-1){
    return;
  }

  historyIndex++;

  restoreState(
    history[historyIndex]
  );

  toastMsg("Redo");
}

function restoreState(state){
  historyLock = true;

  objects.slice().forEach(disposeObject);

  objects = [];
  selected = null;

  let data;

  try{
    data = JSON.parse(state);
  }catch{
    historyLock = false;
    return;
  }

  data.forEach(item => {
    let obj = null;

    if(item.type === "Light"){
      obj = new THREE.PointLight(
        item.color ?? 0xffffff,
        item.intensity ?? 4,
        item.distance ?? 30
      );
    }else{
      const geometry = createGeometry(item.type);

      if(!geometry){
        return;
      }

      obj = new THREE.Mesh(
        geometry,
        makeMaterial(item.color ?? 0xffffff)
      );
    }

    obj.name = item.name || uniqueName(item.type);

    obj.position.fromArray(item.position || [0,0,0]);
    obj.rotation.fromArray(item.rotation || [0,0,0]);
    obj.scale.fromArray(item.scale || [1,1,1]);

    obj.visible = item.visible !== false;

    obj.userData.engine = true;
    obj.userData.type = item.type;
    obj.userData.locked = !!item.locked;
    obj.userData.system = false;

    scene.add(obj);
    objects.push(obj);
  });

  refreshSceneList();

  if(objects.length){
    selectObject(objects[0]);
  }else{
    selectObject(null);
  }

  historyLock = false;

  updateStats();
  updateInspector();
}

/* ============================================================
   SAVE / LOAD
   ============================================================ */

function projectData(){
  return {
    engine:"Bird 3D Engine",
    version:2,
    createdAt:new Date().toISOString(),
    world:{
      background:"#"+scene.background.getHexString(),
      grid:gridVisible,
      snap:snapEnabled
    },
    camera:{
      yaw:targetYaw,
      pitch:targetPitch,
      distance:targetDistance,
      target:targetCameraTarget.toArray()
    },
    scene:snapshot()
  };
}

function saveToFile(){
  const data = projectData();

  const blob = new Blob(
    [JSON.stringify(data,null,2)],
    {type:"application/json"}
  );

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = "bird-engine-project.json";
  a.click();

  setTimeout(() => URL.revokeObjectURL(url),500);

  toastMsg("Project exported");
}

function loadFromFile(){
  const input = document.createElement("input");

  input.type = "file";
  input.accept = ".json,application/json";

  input.onchange = () => {
    const file = input.files?.[0];

    if(!file){
      return;
    }

    const reader = new FileReader();

    reader.onload = () => {
      try{
        const data = JSON.parse(reader.result);

        if(!data.scene){
          throw new Error("Missing scene");
        }

        restoreState(
          JSON.stringify(data.scene)
        );

        if(data.world?.background){
          scene.background.set(
            data.world.background
          );
        }

        if(typeof data.world?.grid === "boolean"){
          gridVisible = data.world.grid;
          if(gridHelper){
            gridHelper.visible = gridVisible;
          }
        }

        if(typeof data.world?.snap === "boolean"){
          snapEnabled = data.world.snap;
          $("snapBtn").textContent =
            snapEnabled ? "🧲 Snap ON" : "🧲 Snap OFF";
        }

        if(data.camera){
          targetYaw = data.camera.yaw ?? targetYaw;
          targetPitch = data.camera.pitch ?? targetPitch;
          targetDistance = data.camera.distance ?? targetDistance;

          if(Array.isArray(data.camera.target)){
            targetCameraTarget.fromArray(
              data.camera.target
            );
          }
        }

        history = [];
        historyIndex = -1;
        saveHistory(false);

        updateInspector();

        toastMsg("Project loaded");
      }catch(error){
        console.error(error);
        toastMsg("Invalid project");
      }
    };

    reader.readAsText(file);
  };

  input.click();
}

function autoSave(){
  try{
    const data = projectData();

    localStorage.setItem(
      "birdEngineAutoSave",
      JSON.stringify(data)
    );
  }catch{}
}

function restoreAutoSave(){
  try{
    const raw =
      localStorage.getItem(
        "birdEngineAutoSave"
      );

    if(!raw){
      return false;
    }

    const data = JSON.parse(raw);

    if(!data.scene){
      return false;
    }

    restoreState(
      JSON.stringify(data.scene)
    );

    return true;
  }catch{
    return false;
  }
}

async function toggleFullscreen(){
  if(document.body.classList.contains("engineFS")){
    exitFullscreen();
    return;
  }

  document.body.classList.add("engineFS");
  resize();

  const root = document.documentElement;

  if(root.requestFullscreen){
    try{
      await root.requestFullscreen();
    }catch{}
  }

  setTimeout(resize,150);
}

function exitFullscreen(){
  document.body.classList.remove("engineFS");

  if(document.fullscreenElement && document.exitFullscreen){
    try{
      document.exitFullscreen();
    }catch{}
  }

  setTimeout(resize,150);
}

function onFullscreenChange(){
  if(!document.fullscreenElement &&
     !document.body.classList.contains("engineFS")){
    return;
  }

  setTimeout(resize,100);
}

function togglePlay(){
  if(isPlaying){
    stopPlay();
  }else{
    startPlay();
  }
}

function startPlay(){
  if(isPlaying){
    return;
  }

  isPlaying = true;

  $("playBtn").textContent = "⏹ Stop";
  UI.playOverlay.style.display = "block";

  createPlayWorld();

  toastMsg("Play mode");
}

function stopPlay(){
  if(!isPlaying){
    return;
  }

  isPlaying = false;

  $("playBtn").textContent = "▶ Play";

  UI.playOverlay.style.display = "none";

  disposePlayWorld();

  toastMsg("Editor mode");
}

function createPlayWorld(){
  playScene = new THREE.Scene();

  playScene.background =
    scene.background.clone();

  playCamera =
    new THREE.PerspectiveCamera(
      70,
      1,
      0.01,
      2000
    );

  playRenderer =
    new THREE.WebGLRenderer({
      antialias:true,
      preserveDrawingBuffer:true
    });

  playRenderer.setPixelRatio(
    Math.min(window.devicePixelRatio || 1,2)
  );

  playRenderer.outputColorSpace =
    THREE.SRGBColorSpace;

  UI.playOverlay.insertBefore(
    playRenderer.domElement,
    UI.playOverlay.firstChild
  );

  playRenderer.domElement.id =
    "playCanvas";

  const light =
    new THREE.HemisphereLight(
      0xffffff,
      0x304030,
      2
    );

  playScene.add(light);

  const sun =
    new THREE.DirectionalLight(
      0xffffff,
      2
    );

  sun.position.set(8,12,6);
  playScene.add(sun);

  const playGround =
    new THREE.Mesh(
      new THREE.PlaneGeometry(200,200),
      new THREE.MeshStandardMaterial({
        color:0x31513b,
        roughness:1
      })
    );

  playGround.rotation.x = -Math.PI/2;
  playScene.add(playGround);

  playObjects = [];

  objects.forEach(source => {
    if(source.userData.type === "Light"){
      const light =
        new THREE.PointLight(
          source.color?.getHex?.() ?? 0xffffff,
          source.intensity ?? 4,
          source.distance ?? 30
        );

      light.position.copy(source.position);
      light.visible = source.visible;

      playScene.add(light);
      return;
    }

    const clone = source.clone(true);

    clone.userData = {
      ...source.userData
    };

    playScene.add(clone);
    playObjects.push(clone);
  });

  player.position.set(
    cameraTarget.x,
    1.2,
    cameraTarget.z+5
  );

  player.yaw = targetYaw + Math.PI;
  player.pitch = 0;
  player.velocityY = 0;
  player.onGround = true;

  playClock = new THREE.Clock();

  resizePlayRenderer();
}

function disposePlayWorld(){
  if(!playRenderer){
    return;
  }

  playRenderer.dispose();

  if(playRenderer.domElement.parentNode){
    playRenderer.domElement.parentNode.removeChild(
      playRenderer.domElement
    );
  }

  playRenderer = null;
  playCamera = null;
  playScene = null;
  playObjects = [];
}

function updatePlay(delta){
  if(!playRenderer ||
     !playScene ||
     !playCamera){
    return;
  }

  const forward =
    -joystick.y;

  const side =
    joystick.x;

  const speed =
    player.speed * delta;

  const sin =
    Math.sin(player.yaw);

  const cos =
    Math.cos(player.yaw);

  player.position.x +=
    (side*cos + forward*sin) * speed;

  player.position.z +=
    (-side*sin + forward*cos) * speed;

  player.velocityY -=
    14*delta;

  player.position.y +=
    player.velocityY*delta;

  if(player.position.y <= 1.2){
    player.position.y = 1.2;
    player.velocityY = 0;
    player.onGround = true;
  }

  playCamera.position.copy(
    player.position
  );

  playCamera.rotation.order = "YXZ";

  playCamera.rotation.y =
    player.yaw;

  playCamera.rotation.x =
    player.pitch;

  playRenderer.render(
    playScene,
    playCamera
  );
}

function jumpPlayer(){
  if(!isPlaying){
    return;
  }

  if(player.onGround){
    player.velocityY = 6;
    player.onGround = false;
  }
}

function playLookMove(dx,dy){
  player.yaw -= dx*0.004;
  player.pitch -= dy*0.003;

  player.pitch =
    clamp(player.pitch,-1.45,1.45);
}

/* ============================================================
   MOBILE PLAY CONTROLS
   ============================================================ */

function bindPlayEvents(){
  const pad = UI.mobilePad;
  const knob = UI.joyKnob;

  pad.addEventListener("pointerdown",e => {
    if(!isPlaying)return;

    joystick.active = true;
    joystick.pointerId = e.pointerId;

    try{
      pad.setPointerCapture(e.pointerId);
    }catch{}

    updateJoystick(
      e.clientX,
      e.clientY
    );
  });

  pad.addEventListener("pointermove",e => {
    if(!joystick.active ||
       e.pointerId !== joystick.pointerId){
      return;
    }

    updateJoystick(
      e.clientX,
      e.clientY
    );
  });

  const stopJoy = e => {
    if(e.pointerId !== joystick.pointerId){
      return;
    }

    joystick.active = false;
    joystick.pointerId = null;
    joystick.x = 0;
    joystick.y = 0;

    knob.style.transform =
      "translate(0px,0px)";
  };

  pad.addEventListener("pointerup",stopJoy);
  pad.addEventListener("pointercancel",stopJoy);

  UI.lookPad.addEventListener("pointerdown",e => {
    if(!isPlaying)return;

    playLook.active = true;
    playLook.pointerId = e.pointerId;
    playLook.x = e.clientX;
    playLook.y = e.clientY;

    try{
      UI.lookPad.setPointerCapture(e.pointerId);
    }catch{}
  });

  UI.lookPad.addEventListener("pointermove",e => {
    if(!playLook.active ||
       e.pointerId !== playLook.pointerId){
      return;
    }

    const dx = e.clientX-playLook.x;
    const dy = e.clientY-playLook.y;

    playLookMove(dx,dy);

    playLook.x = e.clientX;
    playLook.y = e.clientY;
  });

  const stopLook = e => {
    if(e.pointerId !== playLook.pointerId){
      return;
    }

    playLook.active = false;
    playLook.pointerId = null;
  };

  UI.lookPad.addEventListener("pointerup",stopLook);
  UI.lookPad.addEventListener("pointercancel",stopLook);

  $("jumpBtn").onclick = jumpPlayer;
  $("playFocusBtn").onclick = () => {
    if(isPlaying){
      player.position.set(
        cameraTarget.x,
        1.2,
        cameraTarget.z+5
      );
    }
  };

  $("stopBtn").onclick = stopPlay;
  $("playFullBtn").onclick = toggleFullscreen;
}

function updateJoystick(clientX,clientY){
  const rect =
    UI.mobilePad.getBoundingClientRect();

  const cx =
    rect.left + rect.width/2;

  const cy =
    rect.top + rect.height/2;

  let dx =
    clientX-cx;

  let dy =
    clientY-cy;

  const max =
    rect.width*0.30;

  const length =
    Math.hypot(dx,dy);

  if(length > max){
    dx = dx/length*max;
    dy = dy/length*max;
  }

  joystick.x = clamp(dx/max,-1,1);
  joystick.y = clamp(dy/max,-1,1);

  UI.joyKnob.style.transform =
    `translate(${dx}px,${dy}px)`;
}

/* ============================================================
   KEYBOARD
   ============================================================ */

function onKeyDown(e){
  const key = e.key.toLowerCase();

  if((e.ctrlKey || e.metaKey) && key === "z"){
    e.preventDefault();

    if(e.shiftKey){
      redo();
    }else{
      undo();
    }

    return;
  }

  if((e.ctrlKey || e.metaKey) && key === "y"){
    e.preventDefault();
    redo();
    return;
  }

  if(key === "delete" || key === "backspace"){
    if(!isTypingTarget(e.target)){
      deleteSelected();
    }
    return;
  }

  if(key === "f" && !isTypingTarget(e.target)){
    focusObject(selected,true);
    return;
  }

  if(key === "w" && !isTypingTarget(e.target)){
    setMode("move");
    return;
  }

  if(key === "e" && !isTypingTarget(e.target)){
    setMode("rotate");
    return;
  }

  if(key === "r" && !isTypingTarget(e.target)){
    setMode("scale");
    return;
  }

  if(key === "escape"){
    if(isPlaying){
      stopPlay();
    }else if(document.body.classList.contains("engineFS")){
      exitFullscreen();
    }
  }

  if(isPlaying){
    if(key === " "){
      e.preventDefault();
      jumpPlayer();
    }
  }
}

function isTypingTarget(target){
  if(!target){
    return false;
  }

  const tag = target.tagName;

  return tag === "INPUT" ||
         tag === "TEXTAREA" ||
         tag === "SELECT";
}

/* ============================================================
   UTILITIES
   ============================================================ */

function clamp(value,min,max){
  return Math.max(min,Math.min(max,value));
}

function damp(current,target,factor){
  return current+(target-current)*factor;
}

function radToDeg(value){
  return THREE.MathUtils.radToDeg(value);
}

function degToRad(value){
  return THREE.MathUtils.degToRad(value);
}

function toastMsg(message){
  UI.toast.textContent = message;
  UI.toast.style.display = "block";

  clearTimeout(UI.toast._timer);

  UI.toast._timer =
    setTimeout(() => {
      UI.toast.style.display = "none";
    },1200);
}

function updateStats(){
  UI.stats.textContent =
    `${objects.length} object${objects.length===1?"":"s"} • ${fps} FPS`;
}

function resize(){
  if(!renderer || !camera){
    return;
  }

  const width =
    Math.max(1,UI.viewport.clientWidth);

  const height =
    Math.max(1,UI.viewport.clientHeight);

  camera.aspect =
    width/height;

  camera.updateProjectionMatrix();

  renderer.setSize(
    width,
    height,
    false
  );

  resizePlayRenderer();
}

function resizePlayRenderer(){
  if(!playRenderer || !playCamera){
    return;
  }

  const width =
    Math.max(1,UI.viewport.clientWidth);

  const height =
    Math.max(1,UI.viewport.clientHeight);

  playCamera.aspect =
    width/height;

  playCamera.updateProjectionMatrix();

  playRenderer.setSize(
    width,
    height,
    false
  );
}

function onVisibilityChange(){
  if(document.hidden && isPlaying){
    joystick.active = false;
    joystick.x = 0;
    joystick.y = 0;
  }
}

/* ============================================================
   MAIN LOOP
   ============================================================ */

function animate(){
  requestAnimationFrame(animate);

  updateCamera();

  renderer.render(
    scene,
    camera
  );

  if(isPlaying){
    const delta =
      Math.min(
        playClock?.getDelta?.() || 0,
        0.05
      );

    updatePlay(delta);
  }

  fpsFrames++;

  const now = performance.now();

  if(now-fpsTime >= 500){
    fps =
      Math.round(
        fpsFrames*1000/(now-fpsTime)
      );

    fpsFrames = 0;
    fpsTime = now;

    updateStats();
  }
}

/* ============================================================
   START
   ============================================================ */

init();
